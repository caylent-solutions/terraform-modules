---
# AWS Nuke Configuration for Platform QA Account
# Generated from monorepo-config.json
regions:
  - us-east-1
  - us-east-2
  - us-west-1
  - us-west-2
  - eu-central-1
  - eu-central-2
  - eu-west-1
  - eu-west-2
  - eu-west-3
  - eu-north-1
  - eu-south-1
  - eu-south-2
  - ap-northeast-1
  - ap-northeast-2
  - ap-northeast-3
  - ap-southeast-1
  - ap-southeast-2
  - ap-southeast-3
  - ap-southeast-4
  - ap-south-1
  - ap-south-2
  - ap-east-1
  - ca-central-1
  - ca-west-1
  - sa-east-1
  - af-south-1
  - me-south-1
  - me-central-1
  - il-central-1

# Protected accounts that cannot be nuked (injected at runtime)
blocklist: []

# Account-specific configurations (injected at runtime)
accounts: {}

# Presets define filters for resource protection
presets:
  complete-destruction:
    filters:
      # Protect critical IAM roles from deletion
      IAMRole:
        - property: RoleName
          type: exact
          value: OrganizationAccountAccessRole
        - property: RoleName
          type: exact
          value: gh-actions-terraform-modules-pr-main-validation
      
      # Protect AWS managed policies
      IAMPolicy:
        - property: Arn
          type: glob
          value: "arn:aws:iam::aws:policy/*"
      
      # Protect critical role policy attachments
      IAMRolePolicyAttachment:
        - property: RoleName
          type: exact
          value: OrganizationAccountAccessRole
        - property: RoleName
          type: exact
          value: gh-actions-terraform-modules-pr-main-validation

      # Protect Control Tower CloudTrail
      CloudTrailTrail:
        - property: Name
          type: exact
          value: aws-controltower-BaselineCloudTrail
