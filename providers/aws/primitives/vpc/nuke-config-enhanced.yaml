# Enhanced AWS Nuke Configuration for QA Environment
# This configuration includes comprehensive filtering to minimize false-positive errors

regions:
  - us-east-1
  - us-west-2
  - eu-west-1
  - eu-west-2
  - eu-west-3
  - eu-north-1
  - eu-south-1
  - eu-south-2
  - ap-northeast-1
  - ap-northeast-2

account-blocklist:
  - "999999999999" # Example production account - never nuke

accounts:
  "179743357982": # QA Account
    presets:
      - "common"
    filters:
      # ==========================================
      # KMS Aliases - Filter AWS managed aliases
      # ==========================================
      KMSAlias:
        - "alias/aws/dynamodb"
        - "alias/aws/ebs"
        - "alias/aws/elasticfilesystem"
        - "alias/aws/es"
        - "alias/aws/glue"
        - "alias/aws/kinesisvideo"
        - "alias/aws/rds"
        - "alias/aws/redshift"
        - "alias/aws/redshifttest"
        - "alias/aws/s3"
        - "alias/aws/ssm"
        - "alias/aws/xray"
        - type: regex
          value: "alias/aws/.*"

      # ==========================================
      # ElastiCache - Filter default resources
      # ==========================================
      ElasticacheUser:
        - "default"

      ElasticacheCacheParameterGroup:
        - type: regex
          value: "default\\..*"

      # ==========================================
      # MemoryDB - Filter default resources
      # ==========================================
      MemoryDBUser:
        - "default"

      MemoryDBParameterGroup:
        - type: regex
          value: "default\\..*"

      MemoryDBACL:
        - "open-access"

      # ==========================================
      # EC2 - Filter default security groups and VPCs
      # ==========================================
      EC2SecurityGroup:
        - type: regex
          value: "default"

      EC2VPC:
        - property: IsDefault
          value: "true"

      EC2RouteTable:
        - property: tag:Name
          value: "default"

      EC2NetworkACL:
        - property: IsDefault
          value: "true"

      EC2DHCPOption:
        - property: IsDefault
          value: "true"

      # ==========================================
      # AppStream - Filter public AWS images
      # ==========================================
      AppStreamImage:
        - type: regex
          value: "AppStream-.*"
        - type: regex
          value: "Amazon-AppStream2-.*"

      # ==========================================
      # Route53 - Filter default resolver rules
      # ==========================================
      Route53ResolverRule:
        - "rslvr-autodefined-rr-internet-resolver"

      # ==========================================
      # Athena - Filter primary workgroup
      # ==========================================
      AthenaWorkGroup:
        - "primary"

      # ==========================================
      # MediaConvert - Filter default queue
      # ==========================================
      MediaConvertQueue:
        - "Default"

      # ==========================================
      # AppConfig - Filter predefined strategies
      # ==========================================
      AppConfigDeploymentStrategy:
        - type: regex
          value: "AppConfig\\..*"

      # ==========================================
      # OpenSearch - Filter packages starting with G
      # ==========================================
      OSPackage:
        - type: regex
          value: "G[0-9]+"
        - type: regex
          value: "pkg-.*"

      # ==========================================
      # CloudTrail - Filter AWS Control Tower trails
      # ==========================================
      CloudTrailTrail:
        - "aws-controltower-BaselineCloudTrail"

# ==========================================
# Presets for common filtering patterns
# ==========================================
presets:
  common:
    filters:
      # IAM - Keep service-linked roles and AWS managed policies
      IAMRole:
        - type: regex
          value: "AWSServiceRole.*"
        - type: regex
          value: "aws-service-role/.*"

      IAMPolicy:
        - type: regex
          value: "arn:aws:iam::aws:policy/.*"

      # CloudFormation - Keep AWS managed stacks
      CloudFormationStack:
        - type: regex
          value: "aws-controltower-.*"
        - type: regex
          value: "AWSControlTower.*"

      # Config - Keep AWS managed rules
      ConfigServiceConfigRule:
        - type: regex
          value: "aws-.*"

      # CloudWatch - Keep AWS managed dashboards
      CloudWatchDashboard:
        - type: regex
          value: "AWS.*"

      # Lambda - Keep AWS managed layers
      LambdaLayer:
        - type: regex
          value: "arn:aws:lambda:.*:aws:layer:.*"

      # S3 - Keep AWS managed buckets
      S3Bucket:
        - type: regex
          value: "aws-.*"
        - type: regex
          value: "cf-templates-.*"

      # ECR - Keep AWS managed repositories
      ECRRepository:
        - type: regex
          value: "aws-.*"

      # Systems Manager - Keep AWS managed documents
      SSMDocument:
        - type: regex
          value: "AWS-.*"
        - property: Owner
          value: "Amazon"

      # GuardDuty - Keep detectors (they don't cost anything when inactive)
      GuardDutyDetector:
        - type: glob
          value: "*"

      # SecurityHub - Keep hubs (they don't cost anything when inactive)
      SecurityHub:
        - type: glob
          value: "*"
