name: Terraform Module Validation

on:
  workflow_call:
    inputs:
      module_path:
        required: true
        type: string
      module_type:
        required: true
        type: string
    secrets:
      GH_APP_ID:
        required: true
      GH_APP_PRIVATE_KEY:
        required: true
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  terraform-and-contributor-analysis:
    name: Terraform & Contributor Analysis & Workflow Routing
    # This job determines contributor type (internal vs external) and identifies code owners
    # to route the workflow to appropriate approval paths and populate notification context
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      code-owners: ${{ steps.codeowners.outputs.owners }}
      type: ${{ steps.check-contributor.outputs.type }}
      username: ${{ steps.check-contributor.outputs.username }}
      internal: ${{ steps.check-contributor.outputs.internal }}
      can-self-approve: ${{ steps.check-contributor.outputs.can-self-approve }}
    steps:
      - name: Generate token from GitHub App
        id: generate_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a  # v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
      - name: Simulate merge
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git fetch origin ${{ github.base_ref }}
          git fetch origin ${{ github.head_ref }}
          git checkout -b module-validation origin/${{ github.base_ref }}
          git merge --no-commit --no-ff origin/${{ github.head_ref }}
      - name: Install system dependencies for Python build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev \
            libbz2-dev libreadline-dev libsqlite3-dev curl \
            libncursesw5-dev xz-utils tk-dev libxml2-dev \
            libxmlsec1-dev libffi-dev liblzma-dev bc

      - name: Install ASDF
        run: |
          git clone https://github.com/asdf-vm/asdf.git ~/.asdf --branch v0.15.0
          echo "$HOME/.asdf/bin" >> $GITHUB_PATH
          echo "$HOME/.asdf/shims" >> $GITHUB_PATH
          source $HOME/.asdf/asdf.sh

      - name: Install ASDF plugins and tools
        run: |
          cd $GITHUB_WORKSPACE
          cat .tool-versions | cut -d' ' -f1 | xargs -I{} asdf plugin add {} || true
          asdf install
          asdf reshim
          
      - name: Configure environment
        run: make configure

      - name: Run module validation
        run: make module-validate MODULE_PATH=${{ inputs.module_path }} MODULE_TYPE=${{ inputs.module_type }}

      - name: Run Terraform linting
        run: make tf-lint MODULE_PATH=${{ inputs.module_path }}

      - name: Run Terraform formatting check
        run: make tf-format MODULE_PATH=${{ inputs.module_path }}

      - name: Check Terraform documentation is up-to-date
        run: make tf-docs-check MODULE_PATH=${{ inputs.module_path }}

      - name: Run security checks
        run: make tf-security MODULE_PATH=${{ inputs.module_path }}

      - name: Run Terraform plan
        run: make tf-plan MODULE_PATH=${{ inputs.module_path }}

      - name: Run Go linting on module tests
        run: |
          cd ${{ inputs.module_path }}
          make go-lint

      - name: Run Go formatting check on module tests
        run: |
          cd ${{ inputs.module_path }}
          make go-format

      - name: Analyze contributor type (Internal vs External)
        id: check-contributor
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            try {
              // Get PR information from context instead of API call
              const username = context.payload.pull_request.user.login;
              
              // Check if user has self-approval privileges via repository variable
              // Repository variable should be named SELF_APPROVAL_USERS and contain comma-separated usernames
              const selfApprovalUsersVar = '${{ vars.SELF_APPROVAL_USERS }}';
              const selfApprovalUsers = selfApprovalUsersVar ? selfApprovalUsersVar.split(',').map(u => u.trim()) : [];
              const canSelfApprove = selfApprovalUsers.includes(username);
              
              // Try to get organization membership - must succeed for strict validation
              const { data: membership } = await github.rest.orgs.getMembershipForUser({
                org: 'caylent-solutions',
                username: username
              });
              
              const isInternal = membership && membership.state === 'active';
              const contributorType = isInternal ? 'Internal' : 'External';
              
              // Display colorful results
              const emoji = isInternal ? '🏢' : '🌍';
              const approvalEmoji = canSelfApprove ? '🔓' : '🔒';
              const color = isInternal ? '\u001b[32m' : '\u001b[34m'; // Green for internal, Blue for external
              const reset = '\u001b[0m';
              
              console.log(`${color}${emoji} Contributor Detection Results:${reset}`);
              console.log(`${color}  👤 Username: ${username}${reset}`);
              console.log(`${color}  🏷️  Type: ${contributorType}${reset}`);
              console.log(`${color}  🔒 Internal: ${isInternal}${reset}`);
              console.log(`${color}  ${approvalEmoji} Self-Approve: ${canSelfApprove}${reset}`);
              console.log(`${color}  📋 Self-Approval Users: ${selfApprovalUsers.join(', ') || 'None configured'}${reset}`);
              
              core.setOutput('type', contributorType);
              core.setOutput('username', username);
              core.setOutput('internal', isInternal.toString());
              core.setOutput('can-self-approve', canSelfApprove.toString());
            } catch (error) {
              console.log('❌ Error checking contributor:', error);
              core.setFailed('Failed to determine contributor type and membership information - strict validation requires successful organization membership check');
            }
          
      - name: Identify code owners for changed files
        id: codeowners
        if: always()
        run: |
          set +e  # Allow commands to fail
          
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...origin/${{ github.head_ref }})
          echo "Changed files: $CHANGED_FILES"

          SPECIFIC_OWNERS=""
          if [ -f ".github/CODEOWNERS" ]; then
            for FILE in $CHANGED_FILES; do
              # Check for exact file pattern matches (like *.yml, *.json)
              FILE_EXT="${FILE##*.}"
              if [ "$FILE_EXT" != "$FILE" ]; then
                PATTERN_MATCH=$(grep -E "^\*\.$FILE_EXT" .github/CODEOWNERS | awk '{for(i=2;i<=NF;i++) print $i}')
                if [ -n "$PATTERN_MATCH" ]; then
                  SPECIFIC_OWNERS="$SPECIFIC_OWNERS $PATTERN_MATCH"
                  continue
                fi
              fi
              
              # Check for directory-based matches
              TEMP_FILE="$FILE"
              while [[ "$TEMP_FILE" == */* ]]; do
                DIR=$(dirname "$TEMP_FILE")
                # Check for exact directory match
                DIR_MATCH=$(grep -E "^$DIR/" .github/CODEOWNERS | awk '{for(i=2;i<=NF;i++) print $i}')
                if [ -n "$DIR_MATCH" ]; then
                  SPECIFIC_OWNERS="$SPECIFIC_OWNERS $DIR_MATCH"
                  break
                fi
                # Check for directory pattern with trailing slash
                PATTERN_MATCH=$(grep -E "^/$DIR/" .github/CODEOWNERS | awk '{for(i=2;i<=NF;i++) print $i}')
                if [ -n "$PATTERN_MATCH" ]; then
                  SPECIFIC_OWNERS="$SPECIFIC_OWNERS $PATTERN_MATCH"
                  break
                fi
                TEMP_FILE="$DIR"
              done
            done
          fi

          # Require specific owners to be found - no fallback to default
          UNIQUE_OWNERS=$(echo "$SPECIFIC_OWNERS" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ' | xargs)
          if [ -z "$UNIQUE_OWNERS" ]; then
            echo "❌ ERROR: No specific code owners found for the changed files"
            echo "Changed files must match specific patterns in CODEOWNERS, not just the default '*' pattern"
            echo "Please ensure CODEOWNERS file has explicit patterns covering all changed files"
            exit 1
          fi
          echo "Final owners: $UNIQUE_OWNERS"
          echo "owners=$UNIQUE_OWNERS" >> $GITHUB_OUTPUT

      - name: Send validation failure notification to Slack
        if: failure()
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001  # v1.25.0
        with:
          payload: |
            {
              "text": "<!here> :x: Terraform Module Validation Failed - ${{ github.repository }}/${{ inputs.module_path }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<!here> *Terraform Module Validation Failed*"
                  }
                },
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":x: Validation Failed - ${{ github.repository }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:* ${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Module:* `${{ inputs.module_path }}`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Type:* `${{ inputs.module_type }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:* `${{ github.head_ref }}`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Author:* ${{ steps.check-contributor.outputs.username }} (${{ steps.check-contributor.outputs.type }} contributor)"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Code Owners:* ${{ steps.codeowners.outputs.owners }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  run-tests-caylent:
    name: Run Terraform Module Tests (Caylent)
    needs: [terraform-and-contributor-analysis]
    if: ${{ needs.terraform-and-contributor-analysis.outputs.internal == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulate merge
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git fetch origin ${{ github.base_ref }}
          git fetch origin ${{ github.head_ref }}
          git checkout -b caylent-tests origin/${{ github.base_ref }}
          git merge --no-commit --no-ff origin/${{ github.head_ref }}

      - name: Install system dependencies for Python build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev \
            libbz2-dev libreadline-dev libsqlite3-dev curl \
            libncursesw5-dev xz-utils tk-dev libxml2-dev \
            libxmlsec1-dev libffi-dev liblzma-dev bc

      - name: Install ASDF
        run: |
          git clone https://github.com/asdf-vm/asdf.git ~/.asdf --branch v0.15.0
          echo "$HOME/.asdf/bin" >> $GITHUB_PATH
          echo "$HOME/.asdf/shims" >> $GITHUB_PATH
          source $HOME/.asdf/asdf.sh

      - name: Install ASDF plugins and tools
        run: |
          cd $GITHUB_WORKSPACE
          cat .tool-versions | cut -d' ' -f1 | xargs -I{} asdf plugin add {} || true
          asdf install
          asdf reshim
          
      - name: Configure environment
        run: make configure

      - name: Run module tests with configuration
        run: |
          echo "Running tests with module-specific configuration"
          make tf-test MODULE_PATH=${{ inputs.module_path }}
          
      - name: Send PR review request to Slack
        if: success()
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001  # v1.25.0
        with:
          payload: |
            {
              "text": "<!here> :mag: Terraform Module PR Ready for Review - ${{ github.repository }}/${{ inputs.module_path }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<!here> *Terraform Module PR Review Needed*"
                  }
                },
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":mag: Module Ready for Review - ${{ github.repository }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*PR #${{ github.event.pull_request.number }}*: ${{ github.event.pull_request.title }}\nAll validation checks have passed! This Terraform module is ready for review.\n<${{ github.event.pull_request.html_url }}|View Pull Request>"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repository:* ${{ github.repository }}\n*Module:* ${{ inputs.module_path }}\n*Author:* ${{ needs.terraform-and-contributor-analysis.outputs.username }} (${{ needs.terraform-and-contributor-analysis.outputs.type }} contributor)\n*Code Owners:* ${{ needs.terraform-and-contributor-analysis.outputs.code-owners }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Approval>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  merge-approval-caylent:
    name: Merge Approval (Caylent)
    runs-on: ubuntu-24.04
    needs: [terraform-and-contributor-analysis, pr-validation-complete]
    if: success() && needs.terraform-and-contributor-analysis.outputs.internal == 'true' && needs.terraform-and-contributor-analysis.outputs.can-self-approve == 'false'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    environment: merge-approval
    steps:
      - name: Generate GitHub App Token
        id: github-app-token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a  # v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Send approval notification to Slack
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001  # v1.25.0
        with:
          payload: |
            {
              "text": "<!here> :mag: Terraform Module PR Ready for Review - ${{ github.repository }}/${{ inputs.module_path }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<!here> *Terraform Module PR Review Needed*"
                  }
                },
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":mag: Module Ready for Review - ${{ github.repository }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*PR #${{ github.event.pull_request.number }}*: ${{ github.event.pull_request.title }}\nAll validation checks have passed! This Terraform module is ready for review.\n<${{ github.event.pull_request.html_url }}|View Pull Request>"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repository:* ${{ github.repository }}\n*Module:* ${{ inputs.module_path }}\n*Author:* ${{ needs.terraform-and-contributor-analysis.outputs.username }} (${{ needs.terraform-and-contributor-analysis.outputs.type }} contributor)\n*Code Owners:* ${{ needs.terraform-and-contributor-analysis.outputs.code-owners }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Approval>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  merge-self-approval-caylent:
    name: Self-Approval Merge (Caylent)
    runs-on: ubuntu-24.04
    needs: [terraform-and-contributor-analysis, pr-validation-complete]
    if: success() && needs.terraform-and-contributor-analysis.outputs.internal == 'true' && needs.terraform-and-contributor-analysis.outputs.can-self-approve == 'true'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    # No environment needed for self-approval users
    steps:
      - name: Generate GitHub App Token
        id: github-app-token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a  # v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Send self-approval notification to Slack
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001  # v1.25.0
        with:
          payload: |
            {
              "text": ":white_check_mark: Auto-Approved Terraform Module Merge - ${{ github.repository }}/${{ inputs.module_path }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":white_check_mark: *Auto-Approved Terraform Module Merge*"
                  }
                },
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":rocket: Self-Approved Merge - ${{ github.repository }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*PR #${{ github.event.pull_request.number }}*: ${{ github.event.pull_request.title }}\nAll validation checks passed! Module auto-merged by authorized user.\n<${{ github.event.pull_request.html_url }}|View Pull Request>"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repository:* ${{ github.repository }}\n*Module:* ${{ inputs.module_path }}\n*Author:* ${{ needs.terraform-and-contributor-analysis.outputs.username }} (${{ needs.terraform-and-contributor-analysis.outputs.type }} contributor with self-approval privileges)\n*Code Owners:* ${{ needs.terraform-and-contributor-analysis.outputs.code-owners }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
          
      - name: Auto-merge PR (Self-Approval with Admin Bypass)
        if: success()
        env:
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          echo "🔓 Auto-merging PR #${{ github.event.pull_request.number }} by self-approval user with admin bypass"
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "Author: ${{ needs.terraform-and-contributor-analysis.outputs.username }}"
          echo "Module: ${{ inputs.module_path }}"
          
          # Use GitHub CLI to merge with admin bypass to override branch protection rules
          gh pr merge ${{ github.event.pull_request.number }} \
            --admin \
            --squash \
            --subject "${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }})" \
            --body "Self-approved squash merge by authorized user with admin privileges - Module: ${{ inputs.module_path }}"
            });

  run-tests-external:
    name: Run Terraform Module Tests (External)
    needs: [terraform-and-contributor-analysis]
    if: ${{ needs.terraform-and-contributor-analysis.outputs.internal == 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: external-contributor-test-approval
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulate merge
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git fetch origin ${{ github.base_ref }}
          git fetch origin ${{ github.head_ref }}
          git checkout -b external-tests origin/${{ github.base_ref }}
          git merge --no-commit --no-ff origin/${{ github.head_ref }}

      - name: Install system dependencies for Python build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev \
            libbz2-dev libreadline-dev libsqlite3-dev curl \
            libncursesw5-dev xz-utils tk-dev libxml2-dev \
            libxmlsec1-dev libffi-dev liblzma-dev bc
                    
      - name: Install ASDF
        run: |
          git clone https://github.com/asdf-vm/asdf.git ~/.asdf --branch v0.15.0
          echo "$HOME/.asdf/bin" >> $GITHUB_PATH
          echo "$HOME/.asdf/shims" >> $GITHUB_PATH
          source $HOME/.asdf/asdf.sh

      - name: Install ASDF plugins and tools
        run: |
          cd $GITHUB_WORKSPACE
          cat .tool-versions | cut -d' ' -f1 | xargs -I{} asdf plugin add {} || true
          asdf install
          asdf reshim
          
      - name: Configure environment
        run: make configure

      - name: Run module tests with configuration
        run: |
          echo "Running tests with module-specific configuration"
          make tf-test MODULE_PATH=${{ inputs.module_path }}
          
      - name: Send PR review request to Slack
        if: success()
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001  # v1.25.0
        with:
          payload: |
            {
              "text": "<!here> :mag: Terraform Module PR Ready for Review - ${{ github.repository }}/${{ inputs.module_path }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<!here> *Terraform Module PR Review Needed*"
                  }
                },
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":mag: Module Ready for Review - ${{ github.repository }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*PR #${{ github.event.pull_request.number }}*: ${{ github.event.pull_request.title }}\nAll validation checks have passed! This Terraform module is ready for review.\n<${{ github.event.pull_request.html_url }}|View Pull Request>"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repository:* ${{ github.repository }}\n*Module:* ${{ inputs.module_path }}\n*Author:* ${{ needs.terraform-and-contributor-analysis.outputs.username }} (${{ needs.terraform-and-contributor-analysis.outputs.type }} contributor)\n*Code Owners:* ${{ needs.terraform-and-contributor-analysis.outputs.code-owners }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Approval>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  validation-complete:
    name: Validation Complete
    runs-on: ubuntu-24.04
    needs: [terraform-and-contributor-analysis, run-tests-caylent, run-tests-external]
    if: always() && needs.terraform-and-contributor-analysis.result == 'success' && (needs.run-tests-caylent.result == 'success' || needs.run-tests-external.result == 'success')
    steps:
      - name: Mark validation as complete
        run: |
          echo "✅ All validation checks have completed successfully"
          echo "Terraform module validation is complete and ready for merge approval"
          echo "Internal tests: ${{ needs.run-tests-caylent.result }}"
          echo "External tests: ${{ needs.run-tests-external.result }}"

  pr-validation-complete:
    name: PR Validation Complete
    runs-on: ubuntu-24.04
    # This job waits for both terraform and non-terraform validation to complete
    # It provides the single required status check for PR branch protection
    needs: [validation-complete]  # This will be updated by pr-validation.yml to include both workflows
    if: always() && needs.validation-complete.result == 'success'
    steps:
      - name: Mark PR validation as complete
        run: |
          echo "✅ PR Validation Complete - All required checks have passed"
          echo "This status check indicates that all validation requirements are met"
          echo "Ready for merge approval process"

  merge-approval-external:
    name: Merge Approval (External)
    runs-on: ubuntu-24.04
    needs: [terraform-and-contributor-analysis, pr-validation-complete]
    if: success() && needs.terraform-and-contributor-analysis.outputs.internal == 'false'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    environment: external-contributor-merge-approval
    steps:
      - name: Generate GitHub App Token
        id: github-app-token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a  # v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Send approval notification to Slack
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001  # v1.25.0
        with:
          payload: |
            {
              "text": "<!here> :mag: External Contributor Terraform Module PR Ready for Review - ${{ github.repository }}/${{ inputs.module_path }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<!here> *External Contributor Terraform Module PR Review Needed*"
                  }
                },
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":mag: External Module Ready for Review - ${{ github.repository }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*PR #${{ github.event.pull_request.number }}*: ${{ github.event.pull_request.title }}\nAll validation checks have passed! This external contributor's Terraform module is ready for review.\n<${{ github.event.pull_request.html_url }}|View Pull Request>"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repository:* ${{ github.repository }}\n*Module:* ${{ inputs.module_path }}\n*Author:* ${{ needs.terraform-and-contributor-analysis.outputs.username }} (${{ needs.terraform-and-contributor-analysis.outputs.type }} contributor)\n*Code Owners:* ${{ needs.terraform-and-contributor-analysis.outputs.code-owners }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Approval>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
          
      - name: Squash merge PR
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash',
              commit_title: `${pr.title} (#${pr.number})`,
              commit_message: pr.body || 'Squash merge'
            });

  post-merge-validation:
    name: Post-Merge Terraform Validation
    runs-on: ubuntu-24.04
    needs: [terraform-and-contributor-analysis, merge-self-approval-caylent, merge-approval-caylent, merge-approval-external]
    if: always() && needs.terraform-and-contributor-analysis.result == 'success' && (needs.merge-self-approval-caylent.result == 'success' || needs.merge-approval-caylent.result == 'success' || needs.merge-approval-external.result == 'success')
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install system dependencies for Python build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev \
            libbz2-dev libreadline-dev libsqlite3-dev curl \
            libncursesw5-dev xz-utils tk-dev libxml2-dev \
            libxmlsec1-dev libffi-dev liblzma-dev bc

      - name: Install ASDF
        run: |
          git clone https://github.com/asdf-vm/asdf.git ~/.asdf --branch v0.15.0
          echo "$HOME/.asdf/bin" >> $GITHUB_PATH
          echo "$HOME/.asdf/shims" >> $GITHUB_PATH
          source $HOME/.asdf/asdf.sh

      - name: Install ASDF plugins and tools
        run: |
          cd $GITHUB_WORKSPACE
          cat .tool-versions | cut -d' ' -f1 | xargs -I{} asdf plugin add {} || true
          asdf install
          asdf reshim
          
      - name: Configure environment
        run: make configure

      - name: Run module validation
        run: make module-validate MODULE_PATH=${{ inputs.module_path }} MODULE_TYPE=${{ inputs.module_type }}

      - name: Run Terraform linting
        run: make tf-lint MODULE_PATH=${{ inputs.module_path }}

      - name: Run Terraform formatting check
        run: make tf-format MODULE_PATH=${{ inputs.module_path }}

      - name: Check Terraform documentation is up-to-date
        run: make tf-docs-check MODULE_PATH=${{ inputs.module_path }}

      - name: Run security checks
        run: make tf-security MODULE_PATH=${{ inputs.module_path }}

      - name: Run Terraform plan
        run: make tf-plan MODULE_PATH=${{ inputs.module_path }}

      - name: Run Go linting on module tests
        run: |
          cd ${{ inputs.module_path }}
          make go-lint

      - name: Run Go formatting check on module tests
        run: |
          cd ${{ inputs.module_path }}
          make go-format

      - name: Run module tests
        run: make tf-test MODULE_PATH=${{ inputs.module_path }}
        
      - name: Send post-merge validation success to Slack
        if: success()
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001  # v1.25.0
        with:
          payload: |
            {
              "text": "<!here> :white_check_mark: Terraform Module Post-Merge Tests Passed - ${{ github.repository }}/${{ inputs.module_path }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<!here> *Release Approval Required*"
                  }
                },
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":white_check_mark: All Automated Tests Passed - ${{ github.repository }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "All automated tests have passed on the recent merge! Final release approval required.\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repository:* ${{ github.repository }}\n*Module:* ${{ inputs.module_path }}\n*Contributors:* ${{ needs.terraform-and-contributor-analysis.outputs.username }} (${{ needs.terraform-and-contributor-analysis.outputs.type }} contributor)\n*Code Owners:* ${{ needs.terraform-and-contributor-analysis.outputs.code-owners }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Send post-merge validation failure to Slack
        if: failure()
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001  # v1.25.0
        with:
          payload: |
            {
              "text": "<!here> :x: Terraform Module Post-Merge Validation Failed - ${{ github.repository }}/${{ inputs.module_path }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<!here> *Terraform Module Post-Merge Validation Failed* - Immediate attention required!"
                  }
                },
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":x: Post-Merge Failed - ${{ github.repository }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:* ${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Module:* `${{ inputs.module_path }}`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Type:* `${{ inputs.module_type }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:* `main`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Commit:* `${{ github.sha }}`"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  qa-validation-complete:
    name: QA Validation Complete
    runs-on: ubuntu-24.04
    # This job waits for both terraform and non-terraform post-merge validation to complete
    # It provides the consolidated status check before release approval
    needs: [post-merge-validation]  # This will be updated by pr-validation.yml to include both workflows
    if: always() && needs.post-merge-validation.result == 'success'
    steps:
      - name: Mark QA validation as complete
        run: |
          echo "✅ QA Validation Complete - All post-merge validation checks have passed"
          echo "This status check indicates that all quality assurance requirements are met"
          echo "Ready for release approval process"

  qa-certification:
    name: Release Approval
    runs-on: ubuntu-24.04
    needs: [terraform-and-contributor-analysis, qa-validation-complete]
    if: success()
    permissions:
      contents: read
      id-token: write
    environment: qa-certification
    steps:
      - name: Generate GitHub App Token
        id: github-app-token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a  # v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Trigger release workflow
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: {
                release_type: 'terraform-module',
                module_path: '${{ inputs.module_path }}',
                module_type: '${{ inputs.module_type }}',
                type: '${{ needs.terraform-and-contributor-analysis.outputs.type }}',
                username: '${{ needs.terraform-and-contributor-analysis.outputs.username }}'
              }
            });

  release-complete:
    name: Release Complete
    runs-on: ubuntu-24.04
    # This is the final validation step that runs after all release processes
    # It provides the ultimate status check indicating the full release cycle is complete
    needs: [qa-certification]
    if: always() && needs.qa-certification.result == 'success'
    steps:
      - name: Mark release as complete
        run: |
          echo "🎉 Release Complete - All validation and release processes have completed successfully"
          echo "This status check indicates the full release cycle is complete"
          echo "All quality gates have been passed and the release is ready for production"