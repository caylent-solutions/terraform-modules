name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release (terraform-module or non-terraform)'
        required: true
        type: string
      module_path:
        description: 'Path to the Terraform module (only for terraform-module releases)'
        required: false
        type: string
      contributor_type:
        description: 'Type of contributor (Internal or External)'
        required: true
        type: string
      contributor_username:
        description: 'Username of the contributor'
        required: true
        type: string

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Read Python version
      id: python-version
      run: |
        PYTHON_VERSION=$(grep '^python ' .tool-versions | awk '{print $2}')
        echo "version=$PYTHON_VERSION" >> $GITHUB_OUTPUT

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.python-version.outputs.version }}

    - name: Generate GitHub App token
      id: generate_token
      uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a
      with:
        app_id: ${{ secrets.GH_APP_ID }}
        private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

    - name: Install python-semantic-release
      run: pip install -r .github/workflows/requirements-release.txt

    - name: Determine release type & run
      id: run-release
      env:
        GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        set -eo pipefail

        TYPE="${{ github.event.inputs.release_type }}"
        CONTRIB="${{ github.event.inputs.contributor_type }}"
        USER="${{ github.event.inputs.contributor_username }}"

        notify_slack() {
          local TAG="$1"
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rocket: Published *$TAG* ($TYPE) by $USER ($CONTRIB)\"}" \
            $SLACK_WEBHOOK_URL
        }

        git config user.name "caylent-platform-bot[bot]"
        git config user.email "caylent-platform-bot[bot]@users.noreply.github.com"

        if [[ "$TYPE" == "terraform-module" ]]; then
          MODULE="${{ github.event.inputs.module_path }}"
          PREFIX="${MODULE}/v"
          echo "🔧 TF release for: $MODULE"
          echo "DEBUG: Module path: $MODULE"
          echo "DEBUG: Tag prefix: $PREFIX"

          if [[ ! -d "$MODULE" ]]; then
            echo "❌ Module path not found: $MODULE" >&2
            exit 1
          fi

          # Get the latest tag with comprehensive debugging
          echo "DEBUG: Searching for tags with pattern: ${PREFIX}[0-9]*"
          ALL_TAGS=$(git tag --list "${PREFIX}[0-9]*" --sort=-v:refname | cat)
          echo "DEBUG: All matching tags found:"
          echo "$ALL_TAGS" | sed 's/^/  /'
          
          LATEST_TAG=$(echo "$ALL_TAGS" | head -1)
          echo "DEBUG: Latest tag detected: '$LATEST_TAG'"
          
          if [[ -n "$LATEST_TAG" && ! "$LATEST_TAG" =~ ^${PREFIX}[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid tag format: $LATEST_TAG" >&2
            exit 1
          fi

          if [[ -z "$LATEST_TAG" ]]; then
            CURRENT="0.0.0"
            echo "DEBUG: No previous tag found, using initial version: $CURRENT"
          else
            CURRENT="${LATEST_TAG#${PREFIX}}"
            echo "DEBUG: Current version extracted from tag: $CURRENT"
          fi

          # Get commits since last tag with debugging
          echo "DEBUG: Searching for commits since '$LATEST_TAG' in path '$MODULE'"
          if [[ -z "$LATEST_TAG" ]]; then
            COMMITS=$(git log --oneline -- "$MODULE" | cat)
            echo "DEBUG: Getting all commits for module (no previous tag)"
          else
            COMMITS=$(git log --oneline "${LATEST_TAG}..HEAD" -- "$MODULE" | cat)
            echo "DEBUG: Getting commits since last tag"
          fi
          
          echo "DEBUG: Raw commits found:"
          echo "$COMMITS" | sed 's/^/  /'
          
          # Check for version bump triggers with debugging
          FEAT_COMMITS=$(echo "$COMMITS" | grep -E '^[a-f0-9]+ feat(\(.*\))?:' | cat)
          FIX_COMMITS=$(echo "$COMMITS" | grep -E '^[a-f0-9]+ fix(\(.*\))?:' | cat)
          
          echo "DEBUG: Feature commits found:"
          echo "$FEAT_COMMITS" | sed 's/^/  /'
          echo "DEBUG: Fix commits found:"
          echo "$FIX_COMMITS" | sed 's/^/  /'

          if [[ -n "$FEAT_COMMITS" ]]; then
            NEXT=$(echo "$CURRENT" | awk -F. '{print $1"."($2+1)".0"}')
            BUMP_TYPE="minor"
            echo "DEBUG: Feature commits detected, performing minor bump"
          elif [[ -n "$FIX_COMMITS" ]]; then
            NEXT=$(echo "$CURRENT" | awk -F. '{print $1"."$2"."($3+1)}')
            BUMP_TYPE="patch"
            echo "DEBUG: Fix commits detected, performing patch bump"
          else
            echo "ℹ️ No bump needed - no feat: or fix: commits found."
            echo "DEBUG: Available commits do not match bump criteria"
            exit 0
          fi

          NEW_TAG="${PREFIX}${NEXT}"
          echo "DEBUG: New version calculated: $NEXT"
          echo "DEBUG: New tag will be: $NEW_TAG"
          echo "DEBUG: Bump type: $BUMP_TYPE"

          # Check if tag already exists
          if git tag --list | grep -q "^${NEW_TAG}$"; then
            echo "❌ Tag $NEW_TAG already exists!" >&2
            exit 1
          fi

          # Update VERSION file with v prefix
          echo "DEBUG: Writing version to ${MODULE}/VERSION"
          echo "v$NEXT" > "${MODULE}/VERSION"
          echo "DEBUG: VERSION file content:"
          cat "${MODULE}/VERSION" | sed 's/^/  /'

          # Update CHANGELOG
          echo "DEBUG: Updating ${MODULE}/CHANGELOG.md"
          {
            echo "## $NEW_TAG ($(date +'%Y-%m-%d'))"
            echo ""
            echo "$COMMITS" | sed 's/^/* /'
            echo ""
            if [[ -f "${MODULE}/CHANGELOG.md" ]]; then
              cat "${MODULE}/CHANGELOG.md"
            fi
          } > "${MODULE}/CHANGELOG.md.new"
          mv "${MODULE}/CHANGELOG.md.new" "${MODULE}/CHANGELOG.md"
          
          echo "DEBUG: CHANGELOG.md updated, first 10 lines:"
          head -10 "${MODULE}/CHANGELOG.md" | sed 's/^/  /'

          # Git operations with debugging
          echo "DEBUG: Adding files to git"
          git add "${MODULE}/VERSION" "${MODULE}/CHANGELOG.md"
          
          echo "DEBUG: Git status after adding files:"
          git status --porcelain | sed 's/^/  /'
          
          echo "DEBUG: Creating commit"
          git commit -m "chore(release): $NEW_TAG"
          
          echo "DEBUG: Creating tag"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          
          echo "DEBUG: Pushing to origin"
          git push origin HEAD
          git push origin "$NEW_TAG"

          notify_slack "$NEW_TAG"
          echo "✅ Terraform release complete: $NEW_TAG"

        else
          echo "🚀 Non-terraform release with semantic-release"

          # Extract version for future use
          VERSION=$(python -m semantic_release version --print)
          TAG="v$VERSION"

          # Generate changelog
          python -m semantic_release changelog > REPO_CHANGELOG.md
          echo "## $TAG ($(date +'%Y-%m-%d'))" > CHANGELOG.md.new
          echo "" >> CHANGELOG.md.new
          cat REPO_CHANGELOG.md >> CHANGELOG.md.new
          echo "" >> CHANGELOG.md.new
          if [[ -f CHANGELOG.md ]]; then
            cat CHANGELOG.md >> CHANGELOG.md.new
          fi
          mv CHANGELOG.md.new CHANGELOG.md

          echo "$TAG" > VERSION

          git add CHANGELOG.md VERSION
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin HEAD
          git push origin "$TAG"

          notify_slack "$TAG"
          echo "✅ Non-terraform release complete"
        fi

    - name: Show exit status
      run: echo "Release job completed with exit code $?"
