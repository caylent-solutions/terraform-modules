name: AWS Resource Cleanup

on:
  schedule:
    # 2 AM EST (7 AM UTC standard / 6 AM UTC during daylight savings).
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (true = preview only, false = actually delete)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      regions_override:
        description: 'Regions to target (comma-separated, leave empty for all regions)'
        required: false
        default: ''
        type: string
      triggered_by:
        description: 'Who triggered this run'
        required: false
        default: 'Scheduled'
        type: string

concurrency:
  group: aws-nuke-cleanup
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # Security check for manual runs: only repo admins may dispatch a real run.
  security-check:
    name: Security Check
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Generate token from GitHub App
        id: generate_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a  # v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Check if user is GitHub admin
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          REGIONS_OVERRIDE: ${{ github.event.inputs.regions_override }}
          TRIGGERED_BY: ${{ github.event.inputs.triggered_by || github.actor }}
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            const username = context.actor;
            const dryRun = process.env.DRY_RUN;
            const regionsOverride = process.env.REGIONS_OVERRIDE;
            const triggeredBy = process.env.TRIGGERED_BY;
            console.log(`Checking permissions for user: ${username}`);
            try {
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: username
              });
              const isAdmin = permission.permission === 'admin';
              console.log(`User permission level: ${permission.permission}`);
              if (!isAdmin) {
                console.log('SECURITY ALERT: Non-admin user attempting manual AWS cleanup');
                core.setFailed(`Access denied: User '${username}' must have admin permissions to manually trigger AWS cleanup`);
              } else {
                console.log(`Access granted: User '${username}' has admin permissions`);
                console.log(`Triggered by: ${triggeredBy} | Dry run: ${dryRun} | Regions override: ${regionsOverride || '(default)'}`);
                if (dryRun === 'false') {
                  console.log('WARNING: This is a REAL execution - resources will be ACTUALLY DELETED!');
                }
              }
            } catch (error) {
              console.log('Unable to determine user permissions');
              console.log('Error:', error.message);
              core.setFailed('Unable to verify user permissions');
            }

  nuke-aws-resources:
    name: Clean up AWS resources (${{ matrix.account.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [security-check]
    if: ${{ always() && (github.event_name == 'schedule' || needs.security-check.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        # Both pre-production accounts get nuked nightly. Sandbox holds
        # the dev environment; QA holds qa/uat/perf. The prod (136685436188)
        # and root (468627576856) accounts are NEVER nuked -- they are
        # not present in this matrix and never appear in any account
        # variable referenced by this workflow.
        account:
          - name: sandbox
            account_var: PLATFORM_SANDBOX_AWS_ACCOUNT_NUMBER
            role_var: AWS_GITHUB_ACTIONS_ROLE_ARN_SANDBOX
          - name: qa
            account_var: PLATFORM_QA_AWS_ACCOUNT_NUMBER
            role_var: AWS_GITHUB_ACTIONS_ROLE_ARN_QA

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[matrix.account.role_var] }}
          role-session-name: GitHubActions-Nuke-${{ matrix.account.name }}-${{ github.run_id }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Install ASDF
        run: |
          git clone https://github.com/asdf-vm/asdf.git ~/.asdf --branch v0.15.0
          echo "$HOME/.asdf/bin" >> $GITHUB_PATH
          echo "$HOME/.asdf/shims" >> $GITHUB_PATH
          source $HOME/.asdf/asdf.sh
        shell: bash

      - name: Install ASDF plugins and tools
        run: |
          cd $GITHUB_WORKSPACE
          for tool in yq aws-nuke; do
            if grep -q "^$tool " .tool-versions; then
              echo "Installing $tool..."
              asdf plugin add $tool || true
              VERSION=$(grep "^$tool " .tool-versions | awk '{print $2}')
              asdf install $tool $VERSION
            fi
          done
          asdf reshim
        shell: bash

      - name: Verify AWS connection
        run: |
          aws sts get-caller-identity
          echo "Account: $(aws sts get-caller-identity --query Account --output text)"
        shell: bash

      - name: Display execution parameters
        run: |
          echo "Account: ${{ matrix.account.name }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Actor:   ${{ github.actor }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Dry run:           ${{ github.event.inputs.dry_run || 'true' }}"
            echo "Regions override:  ${{ github.event.inputs.regions_override || '(default - all enabled regions)' }}"
            echo "Triggered by:      ${{ github.event.inputs.triggered_by || github.actor }}"
          else
            echo "Dry run:           true (scheduled run)"
            echo "Regions override:  (default - all enabled regions)"
            echo "Triggered by:      GitHub Scheduler"
          fi
        shell: bash

      - name: Render account-injected aws-nuke config
        env:
          ACCOUNT_NUMBER: ${{ vars[matrix.account.account_var] }}
          AWS_NUKE_BLOCKLIST: ${{ vars.AWS_NUKE_BLOCKLIST }}
          REGIONS_OVERRIDE: ${{ github.event.inputs.regions_override }}
        run: |
          set -euo pipefail
          cd aws-nuke-config
          cp aws-nuke-config.yaml aws-nuke-config-temp.yaml

          if [ -z "${ACCOUNT_NUMBER:-}" ]; then
            echo "ERROR: GitHub variable ${{ matrix.account.account_var }} is empty -- refusing to run."
            exit 1
          fi
          echo "Injecting account number: $ACCOUNT_NUMBER"
          yq eval "del(.accounts) | .accounts[\"$ACCOUNT_NUMBER\"] = {\"presets\": [\"complete-destruction\"]}" -i aws-nuke-config-temp.yaml

          # Blocklist is required by aws-nuke v3; default to a single
          # placeholder ID when the GitHub variable is empty.
          BLOCKLIST="${AWS_NUKE_BLOCKLIST:-[\"999999999999\"]}"
          echo "$BLOCKLIST" | yq -p=json -o=yaml '.' | yq eval '.blocklist = load("/dev/stdin")' -i aws-nuke-config-temp.yaml

          if [ -n "${REGIONS_OVERRIDE:-}" ]; then
            echo "Overriding regions: $REGIONS_OVERRIDE"
            IFS=',' read -ra REGIONS <<< "$REGIONS_OVERRIDE"
            REGIONS_YAML="["
            for i in "${!REGIONS[@]}"; do
              REGIONS_YAML+="\"${REGIONS[i]}\""
              if [ $i -lt $((${#REGIONS[@]} - 1)) ]; then
                REGIONS_YAML+=","
              fi
            done
            REGIONS_YAML+="]"
            yq eval ".regions = $REGIONS_YAML" -i aws-nuke-config-temp.yaml
          fi
          echo "Final rendered config:"
          cat aws-nuke-config-temp.yaml
        shell: bash

      - name: Run aws-nuke (dry-run preview)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          echo "Dry-run preview against ${{ matrix.account.name }} (no resources will be deleted)..."
          cd aws-nuke-config
          timeout 3600 aws-nuke run --config ./aws-nuke-config-temp.yaml --force --no-prompt
        shell: bash

      - name: Run aws-nuke (real execution)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false') }}
        run: |
          echo "REAL execution against ${{ matrix.account.name }} -- DELETIONS WILL OCCUR"
          cd aws-nuke-config
          timeout 5400 aws-nuke run --config ./aws-nuke-config-temp.yaml --force --no-prompt --no-dry-run
        shell: bash

      - name: Cleanup Summary
        if: always()
        run: |
          echo "aws-nuke run complete on ${{ matrix.account.name }}"
          echo "Errors above are expected for protected resources -- see preset filters in aws-nuke-config.yaml."
        shell: bash
